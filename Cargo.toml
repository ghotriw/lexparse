[package]
name = "parser-service"
version = "0.1.0"
edition = "2024"
default-run = "parser-service"

[lib]
name = "lexparse"
path = "src/lib.rs"

[[bin]]
name = "parser-service"
path = "src/main.rs"

[[bin]]
name = "lexicon_builder"
path = "src/bin/lexicon_builder.rs"

[[bin]]
name = "correct_idioms"
path = "src/bin/correct_idioms.rs"

[[bin]]
name = "eval_wiktextract"
path = "src/bin/eval_wiktextract.rs"

[[bin]]
name = "extract_wiktextract_test"
path = "src/bin/extract_wiktextract_test.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tch = { version = "0.17", features = ["download-libtorch"] }
tokenizers = { version = "0.19", features = ["hf-hub", "http"] }
ndarray = "0.17"
anyhow = "1.0"
futures = "0.3"
regex = "1"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
toml = "1.1.2"
ureq = { version = "2", features = ["json"] }
tikv-jemallocator = "0.7.0"
tikv-jemalloc-sys = "0.7.0"
libc = "0.2"
